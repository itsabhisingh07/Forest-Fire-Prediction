<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FWI Prediction Form</title>
    <style>
        /* General Page Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* The Form Container */
        .login {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #34495e;
            margin-bottom: 25px;
            font-size: 24px;
        }

        /* Input Fields Styling */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't widen the element */
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }

        /* Button Styling */
        .btn-primary {
            width: 100%;
            background-color: #3498db;
            color: white;
            padding: 12px 20px;
            margin-top: 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        /* Result Text Styling */
        h2 {
            text-align: center;
            color: #e74c3c; /* Red for alert/fire color */
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="login">
        <h1>FWI Prediction</h1>

        <form action="{{ url_for('predict_datapoint') }}" method="post">
            <input type="text" name="Temperature" placeholder="Temperature (°C)" required="required" />
            <input type="text" name="RH" placeholder="RH (%)" required="required" />
            <input type="text" name="Ws" placeholder="Ws (km/h)" required="required" />
            <input type="text" name="Rain" placeholder="Rain (mm)" required="required" />
            <input type="text" name="FFMC" placeholder="FFMC Index" required="required" />
            <input type="text" name="DMC" placeholder="DMC Index" required="required" />
            <input type="text" name="ISI" placeholder="ISI Index" required="required" />
            <input type="text" name="Classes" placeholder="Classes" required="required" />
            <input type="text" name="Region" placeholder="Region" required="required" />

            <button type="submit" class="btn btn-primary btn-block btn-large">Predict Fire Risk</button>
        </form>

        <h2>
           {{results }}
        </h2>
    </div>

</body>
</html>
